---
# tasks file for l3_interfaces

- name: push l3_interfaces configuration
  cisco.ios.ios_config:
    src: l3_interfaces.j2
  register: l3_interfaces

- name: print l3_interfaces commands
  debug:
    msg: "{{l3_interfaces.commands}}"
  when: l3_interfaces.commands is defined
  
