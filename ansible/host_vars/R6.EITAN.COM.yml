


l3_interfaces:
  - name: gig 2
    ipv4: 192.168.2.14/30
    description: "DownLink to Collapsed Core D6.EITAN.COM, made by ansible :)"
    vrf: site_1

  - name: gig 3
    ipv4: 192.168.2.5/30
    description: "DownLink to Collapsed Core D7.EITAN.COM, made by ansible :)"
    vrf: site_1

  - name: gig 1
    ipv4: 203.0.113.0/31
    description: "Wan link to ISP (underlay), made by ansible :)"
    vrf: underlay
##### loopbacks

  - name: loopback1
    ipv4: 6.6.6.6/32
    description: "Loopback for Tunnel Source - Underlay VRF, made by ansible :)"
    vrf: underlay

  - name: loopback2
    ipv4: 60.60.60.60/32
    description: "BGP Overlay Loopback Update-Source, made by ansible :)"
    vrf: site_1











crypto_private:
  ikev2:
    keyring:
      peers:
        - name: R4
          address: 4.4.4.4  
          pre_shared_key: mySecret46
        - name: R1
          address: 1.1.1.1 
          pre_shared_key: mySecret16
        - name: R8
          address: 8.8.8.8
          pre_shared_key: mySecret68
    profile:
      local_identity: "6.6.6.6" 
      match_identities:
        - address: 1.1.1.1 255.255.255.255
        - address: 8.8.8.8 255.255.255.255
        - address: 4.4.4.4 255.255.255.255
  
  
tunnel_vars:
  - tunnel: "tunnel 1"
    ip_address: 10.0.0.6/24
    vrf: "site_1"
    phase_3_action: "shortcut"
    hub_tunnel_ip: "10.0.0.4"
    hub_NBMA_ip: "4.4.4.4"



bgp:
  asn: "65530"
  router_id: 6.6.6.6
  vrf:
    - name: site_1
      redistribute: "ospf 1"
      neighbors:
        - ip: 40.40.40.40
          remote_as: "65510"
          ebgp_multihop: "3"
          source: Loopback2
          activate: true
          
