ospf_ipv4: 
  - process_id: 1
    vrf: site_1
    router_id: 6.6.6.1
    areas:
      - name: 0
        authentication: true
        networks:
          - ip: 192.168.2.4
            wildcard: 0.0.0.3
            
          - ip: 192.168.2.12
            wildcard: 0.0.0.3
        default_originate: 
          metric: 40
        p2p_interfaces:
         
          - name: GigabitEthernet2
          - name: GigabitEthernet3
           
           

  - process_id: 2
    vrf: site_1
    areas:
      - name: 0
        authentication: false
        networks:
          - ip: 10.0.0.0
            wildcard: 0.0.0.255
            
          - ip: 60.60.60.60
            wildcard: 0.0.0.0
        

         

qos_private:
  wan_interface: GigabitEthernet1
  lan_interfaces:
    - GigabitEthernet2
    - GigabitEthernet3

nat:
  nat_range:
  - "10.0.0.0/27"
  - "192.168.2.0/28"
  nat_vrf: site_1   


SSH_MGMT:
  Station: 200.0.0.0
  lines: 0 530
  vrf: underlay
