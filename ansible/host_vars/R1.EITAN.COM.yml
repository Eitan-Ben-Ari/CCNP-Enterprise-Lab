    #       allowas: true
    #       activate: true


         

qos_private:
  wan_interface: GigabitEthernet3
  lan_interfaces:
    - GigabitEthernet1
    - GigabitEthernet2


nat:
  nat_range:
  - "10.0.0.0/27"
  - "192.168.1.0/27"
  nat_vrf: site_2
          



SSH_MGMT:
  Station: 200.0.0.0
  lines: 0 530
  vrf: underlay



     


 


   