ospf_ipv4: 
 

  - process_id: 2
    vrf: site_1_2
    areas:
      - name: 0
        authentication: False
        networks:
          - ip: 10.0.0.0
            wildcard: 0.0.0.255
          - ip: 40.40.40.40
            wildcard: 0.0.0.0
 
          
          












crypto_private:
  ikev2:
    keyring:
      peers:
        - name: R1
          address: 1.1.1.1
          pre_shared_key: mySecret14
        - name: R2
          address: 2.2.2.2 
          pre_shared_key: mySecret24
        - name: R6
          address: 6.6.6.6 
          pre_shared_key: mySecret46
        - name: R8
          address: 8.8.8.8
          pre_shared_key: mySecret48
    profile:
      local_identity: "4.4.4.4 " 
      match_identities:
        - address: 2.2.2.2 255.255.255.255
        - address: 6.6.6.6 255.255.255.255
        - address: 8.8.8.8 255.255.255.255
        - address: 1.1.1.1 255.255.255.255
  
  
tunnel_vars:
  - tunnel: "tunnel 1"
    ip_address: 10.0.0.4/24
    vrf: "site_1_2"
    phase_3_action: "redirect"
   


bgp:
  asn: "65510"
  router_id: 4.4.4.4
  vrf:
    - name: site_1_2
      redistribute: False
      networks:
        - "192.168.3.0 mask 255.255.255.0"
      summary_networks:
        - "192.168.2.0 255.255.255.240"
        - "192.168.1.0 255.255.255.192"
      neighbors:
        - ip: 10.10.10.10
          remote_as: "64540"
          ebgp_multihop: "3"
          source: Loopback2
          activate: true
        - ip: 20.20.20.20
          remote_as: "65530"
          ebgp_multihop: "3"
          source: Loopback2
          activate: true
        - ip: 60.60.60.60
          remote_as: "65530"
          ebgp_multihop: "3"
          source: Loopback2
          activate: true
        - ip: 80.80.80.80
          remote_as: "64540"
          ebgp_multihop: "3"
          source: Loopback2
          activate: true
      
