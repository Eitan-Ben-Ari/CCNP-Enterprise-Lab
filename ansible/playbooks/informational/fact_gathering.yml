- name: Informative
  hosts: all
  gather_facts: False
  connection: network_cli
  tasks:


    - name: hardware facts
      cisco.ios.ios_facts:
        gather_subset: hardware
      register: hardware
     
    - name: interfaces facts
      cisco.ios.ios_facts:
        gather_subset: interfaces
      register: interface

    
    - name: show basic info
      debug:
        msg:
          - "Hostname is {{ansible_net_hostname}}"
          - "Image is {{ansible_net_image}}"

    - name: print all interface facts
      debug:
        var: interface

    - name: print all hardware facts
      debug:
        var: hardware
        
       
      

